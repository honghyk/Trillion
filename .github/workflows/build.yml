name: Build and Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties
      shell: bash

    - name: Build Android app
      if: matrix.os == 'ubuntu-latest'
      run: ./gradlew :android-app:assembleDebug

    - name: Build JVM app
      run: ./gradlew :composeApp:jvmJar

  build-ios:
    name: Build iOS
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Set Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: iOS debug build
        run: cd iosApp && xcodebuild -target "iosApp" -configuration Debug -scheme iosApp -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' CODE_SIGNING_ALLOWED='NO'
