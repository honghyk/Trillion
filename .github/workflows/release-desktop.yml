name: Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*-rc-*'

jobs:
  desktop:
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "${{ secrets.LOCAL_PROPERTIES }}" > local.properties
        shell: bash

      - name: Build
        run: ./gradlew :desktop-app:packageReleaseDistributionForCurrentOS --stacktrace

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-app/build/compose/binaries/main-release/**/*.dmg
            desktop-app/build/compose/binaries/main-release/**/*.msi
            desktop-app/build/compose/binaries/main-release/**/*.exe
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
